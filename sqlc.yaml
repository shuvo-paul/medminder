version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/database/sqlc/queries"
    schema: "internal/common/database/migrations"
    gen:
      go:
        package: "db"
        out: "internal/database/sqlc"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_empty_slices: true
