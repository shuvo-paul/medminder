services:
  db:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-medminder}
      POSTGRES_USER: ${DB_USER:-medminder}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-medminder}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-medminder}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "pnpm --prefix web install && make start"
    volumes:
      - .:/app
      - air_tmp:/app/tmp
      - ./web:/app/web
      - web_node_modules:/app/web/node_modules
    environment:
      CI: "true"
      APP_PORT: ${APP_PORT:-8080}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-medminder}
      DB_PASSWORD: ${DB_PASSWORD:-medminder}
      DB_NAME: ${DB_NAME:-medminder}
      DB_SSLMODE: ${DB_SSLMODE:-false}
    ports:
      - "${APP_PORT:-8080}:8080"
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  air_tmp:
  web_node_modules:
